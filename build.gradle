buildscript {
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven { url 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://jitpack.io' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

repositories {
    jcenter()
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://jitpack.io' }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

version = "1.0"
group = "de.kyrohpaneup.betterlinkcraft"
sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"

    clientJvmArgs += [
            "-Dfml.coreMods.load=de.kyrohpaneup.betterlinkcraft.mixins.MixinLoader",
            "-DtweakClass=org.spongepowered.asm.launch.MixinTweaker",
            "-Dmixin.debug.export=true",
            "-Dmixin.config=mixins.betterlinkcraft.json"
    ]
    serverJvmArgs += [
            "-Dfml.coreMods.load=de.kyrohpaneup.betterlinkcraft.mixins.MixinLoader",
            "-DtweakClass=org.spongepowered.asm.launch.MixinTweaker",
            "-Dmixin.debug.export=true",
            "-Dmixin.config=mixins.betterlinkcraft.json"
    ]
}

runClient {
    args "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude module: 'log4j-core'
    }
}

mixin {
    defaultObfuscationEnv searge
    add sourceSets.main, "mixins.betterlinkcraft.refmap.json"
}

reobf {
}

jar {
    from configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }

    manifest {
        attributes(
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'MixinConfigs': 'mixins.betterlinkcraft.json',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder': '0',
                'FMLCorePlugin': 'de.kyrohpaneup.betterlinkcraft.mixins.MixinLoader'
        )
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}